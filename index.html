<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login & Sign Up Form UI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="circle c1"></div><div class="circle c2"></div><div class="circle c3"></div>

<div class="card">
  <div class="icon"><svg viewBox="0 0 448 512"><path d="M144 144v48h160v-48a80 80 0 0 0-160 0zm-64 48v-48a144 144 0 0 1 288 0v48h16c35 0 64 29 64 64v192c0 35-29 64-64 64H64c-35 0-64-29-64-64V256c0-35 29-64 64-64h16z"/></svg></div>
  <h1 id="title" class="swap">Welcome</h1>
  <p class="sub swap" id="sub">Login to continue your journey</p>

  <form id="login" class="active" novalidate>
    <div class="field"><input type="email" placeholder="Email Address" required></div>
    <div class="field"><input type="password" placeholder="Password" required>
      <button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 576 512"><path d="M288 32C150 32 49 119 4 256c45 137 146 224 284 224s239-87 284-224C527 119 426 32 288 32zm0 368a144 144 0 1 1 0-288 144 144 0 0 1 0 288zm0-224a80 80 0 1 0 0 160 80 80 0 0 0 0-160z"/></svg></button></div>
    <div class="row"><label><input type="checkbox"> Remember me</label><a href="#forgot" onclick="return false">Forgot Password?</a></div>
    <div class="msg"></div>
    <button class="btn" type="submit">Login</button>
    <div class="switch">Don't have an account? <button type="button" class="round" data-go="signup" aria-label="Sign up">+</button></div>
  </form>

  <form id="signup" novalidate>
    <div class="field"><input type="text" placeholder="Full Name" required></div>
    <div class="field"><input type="email" placeholder="Email Address" required></div>
    <div class="field"><input type="password" placeholder="Password" required>
      <button type="button" class="eye" aria-label="Show password"><svg viewBox="0 0 576 512"><path d="M288 32C150 32 49 119 4 256c45 137 146 224 284 224s239-87 284-224C527 119 426 32 288 32zm0 368a144 144 0 1 1 0-288 144 144 0 0 1 0 288zm0-224a80 80 0 1 0 0 160 80 80 0 0 0 0-160z"/></svg></button></div>
    <div class="field"><input type="password" placeholder="Confirm Password" required></div>
    <div class="msg"></div>
    <button class="btn" type="submit">Sign Up</button>
    <div class="switch">Already have an account? <button type="button" class="round" data-go="login" aria-label="Login">←</button></div>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
